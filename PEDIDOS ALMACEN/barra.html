<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Barra — Pedidos</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --oro: #C9A84C; --oro-claro: #E8C97A; --oro-opaco: #C9A84C33;
    --negro: #0A0A08; --carbon: #111109; --carbon2: #1A1A14; --carbon3: #22221A;
    --borde: #C9A84C44; --borde2: #C9A84C88;
    --texto: #F5EDD6; --texto-muted: #8A7D5A; --texto-dim: #4A4230;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Cormorant Garamond', Georgia, serif; background: var(--negro); color: var(--texto); min-height: 100vh; overscroll-behavior: none; }

  /* ── SUCURSAL ── */
  #pantallaSucursal { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 24px; }
  #pantallaApp { display: none; flex-direction: column; height: 100vh; overflow: hidden; }
  .sel-ornamento { font-size: 11px; letter-spacing: 8px; color: var(--oro); opacity: 0.5; text-transform: uppercase; margin-bottom: 10px; text-align: center; }
  .sel-titulo { font-family: 'Playfair Display', serif; font-size: 36px; font-weight: 700; color: var(--oro-claro); letter-spacing: 4px; text-transform: uppercase; text-align: center; }
  .sel-subtitulo { font-size: 14px; color: var(--texto-muted); letter-spacing: 2px; margin-top: 10px; text-align: center; font-style: italic; }
  .sel-linea { width: 60px; height: 1px; background: linear-gradient(90deg, transparent, var(--oro), transparent); margin: 20px auto 40px; }
  .sel-pregunta { font-family: 'Playfair Display', serif; font-size: 13px; letter-spacing: 4px; text-transform: uppercase; color: var(--texto-muted); text-align: center; margin-bottom: 28px; }
  .sucursales-grid { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 360px; }
  .sucursal-btn { background: var(--carbon2); border: 1px solid var(--borde); border-radius: 4px; padding: 24px 28px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 18px; position: relative; }
  .sucursal-btn::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--oro); transform: scaleY(0); transition: transform 0.2s; transform-origin: bottom; }
  .sucursal-btn:active { transform: scale(0.97); background: var(--carbon3); }
  .sucursal-btn:active::before { transform: scaleY(1); }
  .sucursal-icono { font-size: 28px; flex-shrink: 0; }
  .sucursal-nombre { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; color: var(--texto); letter-spacing: 1px; }
  .sucursal-desc { font-size: 12px; color: var(--texto-muted); letter-spacing: 1px; margin-top: 3px; font-style: italic; }
  .sucursal-flecha { color: var(--borde2); font-size: 22px; margin-left: auto; }

  /* ── APP HEADER ── */
  .app-header { flex-shrink: 0; background: var(--carbon2); border-bottom: 1px solid var(--borde); padding: 10px 14px 8px; }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .header-titulo { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 700; color: var(--oro-claro); letter-spacing: 2px; text-transform: uppercase; }
  .sucursal-chip { display: flex; align-items: center; gap: 6px; background: var(--oro-opaco); border: 1px solid var(--borde2); border-radius: 20px; padding: 4px 12px; cursor: pointer; }
  .sucursal-chip:active { background: var(--borde); }
  .sucursal-chip span { font-family: 'Playfair Display', serif; font-size: 12px; color: var(--oro-claro); font-weight: 700; letter-spacing: 1px; }

  /* Buscador */
  .buscador-wrap { position: relative; }
  .buscador-input { width: 100%; background: var(--carbon); border: 1px solid var(--borde); border-radius: 8px; padding: 10px 14px 10px 38px; color: var(--texto); font-family: 'Cormorant Garamond', serif; font-size: 16px; outline: none; transition: border-color 0.2s; }
  .buscador-input:focus { border-color: var(--oro); }
  .buscador-input::placeholder { color: var(--texto-dim); font-style: italic; }
  .buscador-icono { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--texto-muted); font-size: 15px; pointer-events: none; }
  .autocomplete-dropdown { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--carbon2); border: 1px solid var(--borde2); border-radius: 8px; z-index: 200; overflow: hidden; display: none; box-shadow: 0 8px 24px #00000088; }
  .autocomplete-dropdown.visible { display: block; }
  .autocomplete-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; border-bottom: 1px solid var(--borde); font-size: 16px; }
  .autocomplete-item:last-child { border-bottom: none; }
  .autocomplete-item:active { background: var(--carbon3); }
  .ac-nombre { flex: 1; }
  .ac-nombre mark { background: transparent; color: var(--oro); font-weight: 700; }
  .ac-qty { font-family: 'Playfair Display', serif; color: var(--oro); font-size: 14px; font-weight: 700; }
  .sin-resultados { padding: 14px 16px; color: var(--texto-dim); font-style: italic; }

  /* ── BODY SCROLL ── */
  .app-body { flex: 1; overflow-y: auto; padding: 0 12px 10px; -webkit-overflow-scrolling: touch; }

  /* ── SECCIÓN CON ICONO ── */
  .seccion {
    margin-top: 14px;
    background: var(--carbon2);
    border: 1px solid var(--borde);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 4px;
  }

  .seccion-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    background: var(--carbon3);
    border-bottom: 1px solid var(--borde);
  }

  .seccion-icono { font-size: 26px; flex-shrink: 0; }

  .seccion-nombre {
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--oro-claro);
  }

  .seccion-count {
    margin-left: auto;
    font-family: 'Playfair Display', serif;
    font-size: 12px;
    color: var(--oro);
    background: var(--oro-opaco);
    border: 1px solid var(--borde2);
    border-radius: 20px;
    padding: 2px 10px;
    display: none;
  }

  .seccion-count.visible { display: block; }

  /* ── FILA PRODUCTO ── */
  .producto-row {
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--borde);
    min-height: 54px;
    transition: background 0.1s;
  }

  .producto-row:last-child { border-bottom: none; }
  .producto-row.activo { background: #C9A84C08; }

  .producto-tap {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 12px 14px;
    cursor: pointer;
    min-height: 54px;
    user-select: none;
  }

  .producto-tap:active { background: var(--oro-opaco); }

  .prod-nombre {
    font-size: 16px;
    color: var(--texto);
    line-height: 1.2;
  }

  .producto-row.activo .prod-nombre { color: var(--oro-claro); }

  .prod-contador {
    display: flex;
    align-items: center;
    flex-shrink: 0;
    border-left: 1px solid var(--borde);
  }

  .btn-menos, .btn-mas {
    width: 44px; height: 54px;
    border: none; background: transparent;
    color: var(--oro); font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  .btn-menos { color: var(--texto-muted); border-right: 1px solid var(--borde); }
  .btn-mas { border-left: 1px solid var(--borde); }
  .btn-menos:active { background: #8B3A3A22; }
  .btn-mas:active { background: var(--oro-opaco); }

  .prod-cantidad {
    font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 700;
    color: var(--oro-claro); width: 38px; text-align: center;
    background: transparent; border: none; outline: none; cursor: text; padding: 0;
  }

  .prod-cantidad::-webkit-outer-spin-button,
  .prod-cantidad::-webkit-inner-spin-button { -webkit-appearance: none; }
  .prod-cantidad[type=number] { -moz-appearance: textfield; appearance: textfield; }

  /* ── FOOTER ── */
  .app-footer { flex-shrink: 0; background: var(--carbon2); border-top: 1px solid var(--borde); padding: 10px 14px 14px; }
  .resumen-mini { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; min-height: 22px; }
  .resumen-mini-items { font-size: 14px; color: var(--texto-muted); font-style: italic; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 10px; }
  .resumen-mini-items.tiene { color: var(--texto); font-style: normal; }
  .resumen-mini-total { font-family: 'Playfair Display', serif; font-size: 13px; color: var(--oro); font-weight: 700; white-space: nowrap; }
  .nota-input { width: 100%; background: var(--carbon); border: 1px solid var(--borde); border-radius: 8px; padding: 9px 12px; color: var(--texto); font-family: 'Cormorant Garamond', serif; font-size: 15px; resize: none; outline: none; transition: border-color 0.2s; margin-bottom: 10px; }
  .nota-input:focus { border-color: var(--oro); }
  .nota-input::placeholder { color: var(--texto-dim); font-style: italic; }
  .btn-enviar { width: 100%; padding: 16px; background: var(--oro); color: var(--negro); border: none; border-radius: 10px; font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 700; cursor: pointer; letter-spacing: 3px; text-transform: uppercase; transition: all 0.15s; }
  .btn-enviar:active { transform: scale(0.98); }
  .btn-enviar:disabled { background: var(--carbon3); color: var(--texto-dim); cursor: not-allowed; }


  /* ── DRAWER RESUMEN ── */
  .drawer-overlay {
    position: fixed; inset: 0;
    background: #00000077;
    z-index: 300;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .drawer-overlay.visible { opacity: 1; pointer-events: all; }

  .drawer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--carbon2);
    border-top: 1px solid var(--oro);
    border-radius: 18px 18px 0 0;
    z-index: 400;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
    max-height: 80vh;
    display: flex;
    flex-direction: column;
  }

  .drawer.visible { transform: translateY(0); }

  .drawer-handle-wrap {
    padding: 12px 0 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
  }

  .drawer-handle {
    width: 40px; height: 4px;
    background: var(--borde2);
    border-radius: 2px;
  }

  .drawer-titulo {
    font-family: 'Playfair Display', serif;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--oro);
    text-align: center;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--borde);
    flex-shrink: 0;
  }

  .drawer-body {
    overflow-y: auto;
    padding: 4px 0 8px;
    flex: 1;
    -webkit-overflow-scrolling: touch;
  }

  .drawer-vacio {
    text-align: center;
    color: var(--texto-dim);
    font-style: italic;
    font-size: 15px;
    padding: 32px 20px;
  }

  .drawer-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 20px;
    border-bottom: 1px solid var(--borde);
    font-size: 16px;
  }

  .drawer-item:last-child { border-bottom: none; }

  .drawer-item-nombre { flex: 1; color: var(--texto); }

  .drawer-item-qty {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--oro);
    margin-left: 12px;
    min-width: 44px;
    text-align: right;
  }

  .drawer-item-borrar {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1px solid var(--borde);
    background: transparent;
    color: var(--texto-muted);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-left: 10px;
    transition: all 0.15s;
  }

  .drawer-item-borrar:active { background: #8B3A3A33; color: #C97A7A; border-color: #8B3A3A; }

  .drawer-total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    border-top: 1px solid var(--borde2);
    flex-shrink: 0;
    background: var(--carbon3);
  }

  .drawer-total-label {
    font-family: 'Playfair Display', serif;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--texto-muted);
  }

  .drawer-total-num {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--oro-claro);
  }

  .drawer-footer {
    padding: 12px 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
    border-top: 1px solid var(--borde);
  }

  .drawer-nota {
    width: 100%; background: var(--carbon);
    border: 1px solid var(--borde); border-radius: 8px;
    padding: 9px 12px; color: var(--texto);
    font-family: 'Cormorant Garamond', serif; font-size: 15px;
    resize: none; outline: none; transition: border-color 0.2s;
  }
  .drawer-nota:focus { border-color: var(--oro); }
  .drawer-nota::placeholder { color: var(--texto-dim); font-style: italic; }

  .drawer-btn-enviar {
    width: 100%; padding: 16px;
    background: var(--oro); color: var(--negro);
    border: none; border-radius: 10px;
    font-family: 'Playfair Display', serif;
    font-size: 16px; font-weight: 700;
    cursor: pointer; letter-spacing: 3px;
    text-transform: uppercase; transition: all 0.15s;
  }

  .drawer-btn-enviar:active { transform: scale(0.98); }
  .drawer-btn-enviar:disabled { background: var(--carbon3); color: var(--texto-dim); cursor: not-allowed; }

  /* Resumen mini — ahora es clickeable */
  .resumen-mini { cursor: pointer; transition: background 0.15s; border-radius: 8px; padding: 4px 6px; margin: 0 -6px 4px; }
  .resumen-mini:active { background: var(--oro-opaco); }
  .resumen-mini-hint {
    font-size: 11px;
    color: var(--texto-dim);
    letter-spacing: 1px;
    text-align: right;
    margin-bottom: 4px;
  }

  .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-80px); background: var(--carbon2); border: 1px solid var(--oro); color: var(--oro-claro); padding: 12px 28px; border-radius: 8px; font-family: 'Cormorant Garamond', serif; font-size: 15px; letter-spacing: 1px; transition: transform 0.3s ease; z-index: 999; white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { border-color: #8B3A3A; color: #C97A7A; }
</style>

  <meta name="theme-color" content="#C9A84C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

<body>

<div class="toast" id="toast"></div>

<!-- SUCURSAL -->
<div id="pantallaSucursal">
  <div class="sel-ornamento">✦ &nbsp; Sistema de Pedidos &nbsp; ✦</div>
  <div class="sel-titulo">La Barra</div>
  <div class="sel-subtitulo">Restaurante & Eventos</div>
  <div class="sel-linea"></div>
  <div class="sel-pregunta">Seleccioná tu sucursal</div>
  <div class="sucursales-grid">
    <button class="sucursal-btn" data-nombre="Beni" data-icono="🌿">
      <span class="sucursal-icono">🌿</span>
      <div><div class="sucursal-nombre">Beni</div><div class="sucursal-desc">Sucursal Beni</div></div>
      <span class="sucursal-flecha">›</span>
    </button>
    <button class="sucursal-btn" data-nombre="Alemana" data-icono="🏛️">
      <span class="sucursal-icono">🏛️</span>
      <div><div class="sucursal-nombre">Alemana</div><div class="sucursal-desc">Sucursal Alemana</div></div>
      <span class="sucursal-flecha">›</span>
    </button>
    <button class="sucursal-btn" data-nombre="Zoológico" data-icono="🦁">
      <span class="sucursal-icono">🦁</span>
      <div><div class="sucursal-nombre">Zoológico</div><div class="sucursal-desc">Sucursal Zoológico</div></div>
      <span class="sucursal-flecha">›</span>
    </button>
  </div>
</div>

<!-- APP -->
<div id="pantallaApp">
  <div class="app-header">
    <div class="header-top">
      <div class="header-titulo">La Barra</div>
      <div class="sucursal-chip" id="sucursalChip">
        <span id="chipIcono">🌿</span>
        <span id="chipNombre">—</span>
      </div>
    </div>
    <div class="buscador-wrap" id="buscadorWrap">
      <span class="buscador-icono">🔍</span>
      <input type="text" class="buscador-input" id="buscadorInput" placeholder="Buscar producto..." autocomplete="off"/>
      <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
    </div>
  </div>

  <div class="app-body" id="appBody"></div>

  <div class="app-footer">
    <div class="resumen-mini" id="resumenMiniTrigger">
      <div class="resumen-mini-hint" id="resumenMiniHint">↑ Tocá para revisar el pedido</div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div class="resumen-mini-items" id="resumenMiniTexto">Ningún producto seleccionado</div>
        <div class="resumen-mini-total" id="resumenMiniTotal"></div>
      </div>
    </div>
    <button class="btn-enviar" id="btnEnviar">Enviar pedido</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, collection, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  const SECCIONES = [
    {
      id: 'gaseosas', nombre: 'Gaseosas', icono: '🥤',
      productos: [
        { id: 'coca_350',       nombre: 'Coca Cola 350ml' },
        { id: 'coca_500',       nombre: 'Coca Cola 500ml' },
        { id: 'coca_1500',      nombre: 'Coca Cola 1.5L' },
        { id: 'coca_zero_350',  nombre: 'Coca Cola Zero 350ml' },
        { id: 'sprite_350',     nombre: 'Sprite 350ml' },
        { id: 'sprite_500',     nombre: 'Sprite 500ml' },
        { id: 'sprite_1500',    nombre: 'Sprite 1.5L' },
        { id: 'fanta_350',      nombre: 'Fanta 350ml' },
        { id: 'fanta_500',      nombre: 'Fanta 500ml' },
        { id: 'schweppes_350',  nombre: 'Schweppes 350ml' },
        { id: 'schweppes_1500', nombre: 'Schweppes 1.5L' },
        { id: 'tonica_350',     nombre: 'Tónica 350ml' },
        { id: 'agua_sin_500',   nombre: 'Agua sin gas 500ml' },
        { id: 'agua_sin_1500',  nombre: 'Agua sin gas 1.5L' },
        { id: 'agua_con_500',   nombre: 'Agua con gas 500ml' },
        { id: 'agua_con_1500',  nombre: 'Agua con gas 1.5L' },
      ]
    },
    {
      id: 'cervezas', nombre: 'Cervezas', icono: '🍺',
      productos: [
        { id: 'cerveza_350',  nombre: 'Cerveza 350ml' },
        { id: 'cerveza_600',  nombre: 'Cerveza 600ml' },
        { id: 'cerveza_lt',   nombre: 'Cerveza 1L' },
        { id: 'cerveza_sin',  nombre: 'Cerveza sin alcohol' },
      ]
    },
    {
      id: 'galletas', nombre: 'Galletas', icono: '🍪',
      productos: [
        { id: 'galleta_sal',   nombre: 'Galletas de sal' },
        { id: 'galleta_dulce', nombre: 'Galletas dulces' },
      ]
    },
    {
      id: 'bolsas', nombre: 'Bolsas', icono: '🛍️',
      productos: [
        { id: 'bolsa_chica',  nombre: 'Bolsa chica' },
        { id: 'bolsa_grande', nombre: 'Bolsa grande' },
      ]
    },
    {
      id: 'otros', nombre: 'Otros', icono: '📦',
      productos: [
        { id: 'servilletas', nombre: 'Servilletas' },
        { id: 'pajillas',    nombre: 'Pajillas' },
      ]
    },
  ];

  const TODOS = SECCIONES.flatMap(s => s.productos);

  const firebaseConfig = {
    apiKey: "AIzaSyA_oHjATWDHDvSv7ztqPDfWJkXuLR9ceZs",
    authDomain: "proyecto-2-bara.firebaseapp.com",
    projectId: "proyecto-2-bara",
    storageBucket: "proyecto-2-bara.firebasestorage.app",
    messagingSenderId: "467039108962",
    appId: "1:467039108962:web:e7eb55bd1e10eca09bf63b"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const cantidades = {};
  TODOS.forEach(p => { cantidades[p.id] = 0; });
  let sucursalActiva = { nombre: '', icono: '' };

  // ── SUCURSAL ──
  document.querySelectorAll('.sucursal-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      sucursalActiva = { nombre: btn.dataset.nombre, icono: btn.dataset.icono };
      document.getElementById('chipIcono').textContent = sucursalActiva.icono;
      document.getElementById('chipNombre').textContent = sucursalActiva.nombre;
      document.getElementById('pantallaSucursal').style.display = 'none';
      const pa = document.getElementById('pantallaApp');
      pa.style.display = 'flex';
      renderBody();
    });
  });

  document.getElementById('sucursalChip').addEventListener('click', () => {
    document.getElementById('pantallaApp').style.display = 'none';
    document.getElementById('pantallaSucursal').style.display = 'flex';
    TODOS.forEach(p => { cantidades[p.id] = 0; });
    actualizarResumen();
  });

  // ── RENDER BODY ──
  function renderBody() {
    const body = document.getElementById('appBody');
    body.innerHTML = '';

    SECCIONES.forEach(sec => {
      const secDiv = document.createElement('div');
      secDiv.className = 'seccion';
      secDiv.id = 'sec-' + sec.id;

      // Header sección
      const header = document.createElement('div');
      header.className = 'seccion-header';
      header.innerHTML = `
        <span class="seccion-icono">${sec.icono}</span>
        <span class="seccion-nombre">${sec.nombre}</span>
        <span class="seccion-count" id="count-${sec.id}"></span>`;
      secDiv.appendChild(header);

      // Productos
      sec.productos.forEach(p => {
        const row = document.createElement('div');
        row.className = 'producto-row' + (cantidades[p.id] > 0 ? ' activo' : '');
        row.id = 'row-' + p.id;

        const tap = document.createElement('div');
        tap.className = 'producto-tap';
        tap.innerHTML = `<span class="prod-nombre">${p.nombre}</span>`;
        tap.addEventListener('click', () => {
          cantidades[p.id]++;
          actualizarRow(p.id);
          actualizarResumen();
          actualizarCountSeccion(sec.id);
          flashRow(p.id);
        });

        const contador = document.createElement('div');
        contador.className = 'prod-contador';

        const btnMenos = document.createElement('button');
        btnMenos.className = 'btn-menos';
        btnMenos.textContent = '−';
        btnMenos.type = 'button';
        btnMenos.addEventListener('click', e => {
          e.stopPropagation();
          cantidades[p.id] = Math.max(0, cantidades[p.id] - 1);
          actualizarRow(p.id);
          actualizarResumen();
          actualizarCountSeccion(sec.id);
        });

        const inputNum = document.createElement('input');
        inputNum.type = 'number';
        inputNum.className = 'prod-cantidad';
        inputNum.value = cantidades[p.id];
        inputNum.min = '0';
        inputNum.setAttribute('data-id', p.id);
        inputNum.addEventListener('click', e => e.stopPropagation());
        inputNum.addEventListener('focus', () => inputNum.select());
        inputNum.addEventListener('input', () => {
          cantidades[p.id] = Math.max(0, parseInt(inputNum.value) || 0);
          actualizarRowEstado(p.id);
          actualizarResumen();
          actualizarCountSeccion(sec.id);
        });
        inputNum.addEventListener('blur', () => { inputNum.value = cantidades[p.id]; });
        inputNum.addEventListener('keydown', e => { if (e.key === 'Enter') inputNum.blur(); });

        const btnMas = document.createElement('button');
        btnMas.className = 'btn-mas';
        btnMas.textContent = '+';
        btnMas.type = 'button';
        btnMas.addEventListener('click', e => {
          e.stopPropagation();
          cantidades[p.id]++;
          actualizarRow(p.id);
          actualizarResumen();
          actualizarCountSeccion(sec.id);
        });

        contador.appendChild(btnMenos);
        contador.appendChild(inputNum);
        contador.appendChild(btnMas);
        row.appendChild(tap);
        row.appendChild(contador);
        secDiv.appendChild(row);
      });

      body.appendChild(secDiv);
    });
  }

  function actualizarRow(id) {
    const input = document.querySelector(`.prod-cantidad[data-id="${id}"]`);
    if (input) input.value = cantidades[id];
    actualizarRowEstado(id);
  }

  function actualizarRowEstado(id) {
    const row = document.getElementById('row-' + id);
    if (row) row.classList.toggle('activo', cantidades[id] > 0);
  }

  function flashRow(id) {
    const row = document.getElementById('row-' + id);
    if (!row) return;
    row.style.background = 'var(--oro-opaco)';
    setTimeout(() => { row.style.background = ''; }, 250);
  }

  function actualizarCountSeccion(secId) {
    const sec = SECCIONES.find(s => s.id === secId);
    if (!sec) return;
    const total = sec.productos.reduce((s, p) => s + cantidades[p.id], 0);
    const el = document.getElementById('count-' + secId);
    if (!el) return;
    if (total > 0) {
      el.textContent = total + ' ud.';
      el.classList.add('visible');
    } else {
      el.classList.remove('visible');
    }
  }

  // ── RESUMEN ──
  function actualizarResumen() {
    const items = TODOS.filter(p => cantidades[p.id] > 0);
    const textoEl = document.getElementById('resumenMiniTexto');
    const totalEl = document.getElementById('resumenMiniTotal');
    if (items.length === 0) {
      textoEl.textContent = 'Ningún producto seleccionado';
      textoEl.classList.remove('tiene');
      totalEl.textContent = '';
    } else {
      textoEl.textContent = items.map(p => `${p.nombre} ×${cantidades[p.id]}`).join(' · ');
      textoEl.classList.add('tiene');
      totalEl.textContent = `${items.reduce((s, p) => s + cantidades[p.id], 0)} ud.`;
    }
  }

  // ── BUSCADOR ──
  const buscadorInput = document.getElementById('buscadorInput');
  const dropdown = document.getElementById('autocompleteDropdown');

  buscadorInput.addEventListener('input', () => {
    const q = buscadorInput.value.trim().toLowerCase();
    if (!q) { cerrarDropdown(); return; }
    const resultados = TODOS.filter(p => p.nombre.toLowerCase().includes(q));
    if (resultados.length === 0) {
      dropdown.innerHTML = '<div class="sin-resultados">Sin resultados</div>';
    } else {
      dropdown.innerHTML = resultados.map(p => {
        const regex = new RegExp(`(${q})`, 'gi');
        const resaltado = p.nombre.replace(regex, '<mark>$1</mark>');
        return `<div class="autocomplete-item" data-id="${p.id}">
          <span class="ac-nombre">${resaltado}</span>
          ${cantidades[p.id] > 0 ? `<span class="ac-qty">×${cantidades[p.id]}</span>` : ''}
        </div>`;
      }).join('');
      dropdown.querySelectorAll('.autocomplete-item').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.getAttribute('data-id');
          cantidades[id]++;
          actualizarRow(id);
          actualizarResumen();
          const sec = SECCIONES.find(s => s.productos.some(p => p.id === id));
          if (sec) actualizarCountSeccion(sec.id);
          const row = document.getElementById('row-' + id);
          if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
          flashRow(id);
          buscadorInput.value = '';
          cerrarDropdown();
        });
      });
    }
    dropdown.classList.add('visible');
  });

  buscadorInput.addEventListener('keydown', e => { if (e.key === 'Escape') { buscadorInput.value = ''; cerrarDropdown(); } });
  document.addEventListener('click', e => { if (!document.getElementById('buscadorWrap').contains(e.target)) cerrarDropdown(); });
  function cerrarDropdown() { dropdown.classList.remove('visible'); dropdown.innerHTML = ''; }

  // ── BOTÓN ENVIAR (abre drawer) ──
  document.getElementById('btnEnviar').addEventListener('click', abrirDrawer);

  // ── DRAWER ──
  function abrirDrawer() {
    renderDrawer();
    // Sync nota
    document.getElementById('drawerNota').value = document.getElementById('notaInput') ? document.getElementById('notaInput').value || '' : '';
    document.getElementById('drawer').classList.add('visible');
    document.getElementById('drawerOverlay').classList.add('visible');
    document.body.style.overflow = 'hidden';
  }

  function cerrarDrawer() {
    document.getElementById('drawer').classList.remove('visible');
    document.getElementById('drawerOverlay').classList.remove('visible');
    document.body.style.overflow = '';
  }

  function renderDrawer() {
    const body = document.getElementById('drawerBody');
    const items = TODOS.filter(p => cantidades[p.id] > 0);
    const totalEl = document.getElementById('drawerTotal');
    const totalNum = document.getElementById('drawerTotalNum');

    if (items.length === 0) {
      body.innerHTML = '<div class="drawer-vacio">No hay productos seleccionados aún</div>';
      totalEl.style.display = 'none';
      return;
    }

    totalEl.style.display = 'flex';
    const total = items.reduce((s, p) => s + cantidades[p.id], 0);
    totalNum.textContent = total + ' ud.';

    body.innerHTML = items.map(p => `
      <div class="drawer-item">
        <span class="drawer-item-nombre">${p.nombre}</span>
        <span class="drawer-item-qty">× ${cantidades[p.id]}</span>
        <button class="drawer-item-borrar" data-id="${p.id}" title="Quitar">✕</button>
      </div>
    `).join('');

    body.querySelectorAll('.drawer-item-borrar').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        cantidades[id] = 0;
        actualizarRow(id);
        actualizarResumen();
        const sec = SECCIONES.find(s => s.productos.some(p => p.id === id));
        if (sec) actualizarCountSeccion(sec.id);
        renderDrawer();
      });
    });
  }

  // Abrir drawer
  document.getElementById('resumenMiniTrigger').addEventListener('click', abrirDrawer);
  document.getElementById('drawerOverlay').addEventListener('click', cerrarDrawer);
  document.getElementById('drawerHandleWrap').addEventListener('click', cerrarDrawer);

  // Swipe down para cerrar
  let touchStartY = 0;
  document.getElementById('drawer').addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; });
  document.getElementById('drawer').addEventListener('touchend', e => {
    if (e.changedTouches[0].clientY - touchStartY > 60) cerrarDrawer();
  });

  // Botón enviar dentro del drawer
  document.getElementById('drawerBtnEnviar').addEventListener('click', async () => {
    const items = TODOS.filter(p => cantidades[p.id] > 0);
    if (items.length === 0) { mostrarToast('Seleccioná al menos un producto', true); return; }
    const nota = document.getElementById('drawerNota').value.trim();
    const btn = document.getElementById('drawerBtnEnviar');
    btn.disabled = true; btn.textContent = 'Enviando...';
    try {
      await addDoc(collection(db, 'pedidos'), {
        sucursal: sucursalActiva.nombre,
        sucursalIcono: sucursalActiva.icono,
        items: items.map(p => ({ nombre: p.nombre, cantidad: cantidades[p.id] })),
        nota: nota || '',
        estado: 'pendiente',
        timestamp: serverTimestamp()
      });
      cerrarDrawer();
      mostrarToast(`✦ Pedido enviado — ${sucursalActiva.nombre}`);
      TODOS.forEach(p => { cantidades[p.id] = 0; });
      document.getElementById('drawerNota').value = '';
      renderBody();
      actualizarResumen();
      SECCIONES.forEach(s => actualizarCountSeccion(s.id));
    } catch(e) { mostrarToast('Error al enviar', true); console.error(e); }
    btn.disabled = false; btn.textContent = 'Enviar pedido';
  });


  function mostrarToast(msg, error = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (error ? ' error' : '');
    setTimeout(() => { t.className = 'toast'; }, 3000);
  }
</script>

<!-- DRAWER -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle-wrap" id="drawerHandleWrap">
    <div class="drawer-handle"></div>
  </div>
  <div class="drawer-titulo">Revisá tu pedido</div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-total" id="drawerTotal" style="display:none">
    <span class="drawer-total-label">Total unidades</span>
    <span class="drawer-total-num" id="drawerTotalNum">0</span>
  </div>
  <div class="drawer-footer">
    <textarea class="drawer-nota" id="drawerNota" rows="1" placeholder="Nota para almacén..."></textarea>
    <button class="drawer-btn-enviar" id="drawerBtnEnviar">Enviar pedido</button>
  </div>
</div>

</body>
</html>
